services:
  android-emulator:
    image: budtmo/docker-android:emulator_14.0
    container_name: android-emulator
    privileged: true
    devices:
      - "/dev/kvm:/dev/kvm"
    ports:
      - "6080:6080"
      - "5555:5555"
    environment:
      - EMULATOR_DEVICE=Samsung Galaxy S10 # Corrected variable
      - WEB_VNC=true # Forces VNC to start
      - APPIUM=false
      - AUTO_RECORD=false
      - DEVICE_BOOT_ARGS=-writable-system
